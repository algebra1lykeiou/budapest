<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Travel Guides 2027</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400;7..72,500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f2f4f3;
  --ink: #16242b;
  --muted: #5e6b70;
  --accent: #0f6b5f;
  --serif: "Literata", Georgia, "Times New Roman", serif;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--sans);
  max-width: 600px;
  margin: 0 auto;
  height: 100vh;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  padding: calc(20px + env(safe-area-inset-top, 0px)) 16px calc(16px + env(safe-area-inset-bottom, 0px));
}
header { flex: none; padding: 0 4px 18px; }
h1 {
  font-family: var(--serif);
  font-weight: 500;
  font-size: clamp(1.7rem, 8vw, 2.6rem);
  white-space: nowrap;
  line-height: 1.1;
  letter-spacing: -0.025em;
}
.subtitle { margin-top: 6px; color: var(--muted); font-size: 1.05rem; }

ul {
  list-style: none;
  flex: none;
  display: flex;
  flex-direction: column;
  gap: 14px;
  animation: enter 0.7s ease-out both;
}
li { flex: none; height: 30vh; height: 30dvh; }
.tile {
  position: relative;
  display: block;
  height: 100%;
  overflow: hidden;
  border-radius: 20px;
  background: var(--ink);
  color: #fff;
  text-decoration: none;
  cursor: pointer;
  transition: transform 0.2s;
}
.tile img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  animation: fade 0.6s ease-out both;
  transition: transform 0.8s cubic-bezier(0.2, 0.7, 0.2, 1);
}
.tile::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(to top, rgba(10, 20, 25, 0.7) 0%, rgba(10, 20, 25, 0) 55%);
}
.caption { position: absolute; left: 22px; right: 22px; bottom: 20px; z-index: 1; }
.caption h2 {
  font-family: var(--serif);
  font-weight: 500;
  font-size: clamp(2rem, 9vw, 2.6rem);
  line-height: 1.1;
  letter-spacing: -0.02em;
}
.caption p { margin-top: 4px; font-size: 1.05rem; color: rgba(255, 255, 255, 0.85); }
.tile:active { transform: scale(0.985); }
.tile:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
@media (hover: hover) {
  .tile:hover img { transform: scale(1.04); }
}

@keyframes enter { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>

<header>
  <h1>Travel Guides 2027</h1>
  <p class="subtitle">Επίλεξε πόλη</p>
</header>

<ul>
  <li>
    <a class="tile" id="tile-budapest" href="budapest/index.html">
      <span class="caption"><h2>Βουδαπέστη</h2><p>9 αξιοθέατα και μέρη</p></span>
    </a>
  </li>
  <li>
    <a class="tile" id="tile-bratislava" href="bratislava/index.html">
      <span class="caption"><h2>Μπρατισλάβα</h2><p>9 αξιοθέατα και μέρη</p></span>
    </a>
  </li>
</ul>

<script>
    // Φωτογραφία για κάθε πόλη, από την κύρια εικόνα του άρθρου στη Wikipedia
    const covers = {
        budapest: "Hungarian Parliament Building",
        bratislava: "Bratislava Castle"
    };

    async function loadCover(key) {
        const url = 'https://en.wikipedia.org/w/api.php?action=query&format=json&origin=*'
            + '&generator=search&gsrlimit=3&prop=pageimages&piprop=thumbnail&pithumbsize=960'
            + '&gsrsearch=' + encodeURIComponent(covers[key]);
        try {
            const res = await fetch(url);
            const data = await res.json();
            const pages = Object.values((data.query && data.query.pages) || {})
                .filter((p) => p.thumbnail)
                .sort((a, b) => a.index - b.index);
            if (!pages.length) return;
            const img = document.createElement('img');
            img.alt = '';
            img.onerror = () => img.remove();
            img.src = pages[0].thumbnail.source;
            document.getElementById('tile-' + key).prepend(img);
        } catch (e) { /* χωρίς φωτογραφία, μένει το σκούρο φόντο */ }
    }
    Object.keys(covers).forEach(loadCover);
</script>
</body>
</html>
